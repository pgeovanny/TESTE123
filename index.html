<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECLIPSE — Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#080c17;color:#e7e6f3;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;pointer-events:none}.top{left:18px;top:16px;background:#131a2adf;padding:15px;border:1px solid #435074;border-radius:12px;min-width:245px}.name{font-weight:800;letter-spacing:2px}.small{color:#a6acc8;font-size:12px;margin:6px 0}.bar{height:11px;background:#263044;border-radius:7px;overflow:hidden;margin:5px 0}.fill{height:100%;width:100%;transition:width .16s}.hp{background:linear-gradient(90deg,#b32844,#f45d69)}.mp{background:#567feb}.xp{background:#b99655}.bottom{left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:7px}.slot{width:61px;height:64px;background:#111b2be8;border:1px solid #566587;border-radius:10px;position:relative;text-align:center;padding:5px;font-size:10px}.slot .n{position:absolute;top:3px;left:6px;color:#b8c5ed}.slot .ico{font-size:27px;line-height:46px}.cd{position:absolute;inset:0;border-radius:10px;background:#040916cc;display:grid;place-items:center;font-size:17px;font-weight:bold}.notice{right:20px;top:18px;background:#131a2ae8;padding:12px 16px;border:1px solid #3f4a66;border-radius:11px;font-size:12px;max-width:230px}.inv{display:none;position:fixed;right:18px;bottom:110px;width:240px;background:#141b2aec;border:1px solid #5d6684;border-radius:13px;padding:16px;z-index:3}.inv.show{display:block}.target{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#121929db;padding:10px 20px;border-radius:12px;border:1px solid #514666;min-width:180px;text-align:center;display:none}.msg{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);font-size:13px;color:#f5d393;pointer-events:none}button{pointer-events:auto;background:#273553;color:white;border:1px solid #54638b;border-radius:8px;padding:7px}body{background:#070d16;font-family:Trebuchet MS,system-ui,sans-serif}canvas{background:#132824}.top,.notice,.target,.inv{background:linear-gradient(145deg,#141d2beb,#0b111de8)!important;border:1px solid #73836c88!important;box-shadow:0 12px 36px #0009, inset 0 1px #d8c78d26!important;backdrop-filter:blur(10px)}.top{padding:18px!important;min-width:258px!important}.name{font-family:Georgia,serif!important;font-size:23px!important;color:#e9d4a0;letter-spacing:3px!important;text-shadow:0 2px 12px #eab77c40}.notice{top:auto!important;bottom:17px!important;right:18px!important;font-size:11px!important;line-height:1.85}.small{color:#b0b6c0!important}.bottom{bottom:21px!important;gap:6px!important;padding:10px 13px;border:1px solid #a18e634a;border-radius:15px;background:linear-gradient(#111926e8,#080d17f5);box-shadow:0 15px 35px #000a}.slot{width:64px!important;height:69px!important;background:linear-gradient(150deg,#304056,#111725)!important;border:1px solid #8b815f!important;border-radius:7px!important;box-shadow:inset 0 0 0 3px #0b1423,0 2px 9px #000b!important}.slot:hover{filter:brightness(1.5)}.slot .ico{font-size:27px!important;text-shadow:0 0 15px #9eb6ff99}.slot .n{font-weight:900;color:#e8d2a5!important}.cd{background:#050a11c9!important}.bar{border:1px solid #c1ae8652;height:13px!important;background:#080c11!important}.hp{background:linear-gradient(90deg,#721c30,#ee4b5e)!important}.mp{background:linear-gradient(90deg,#214483,#60a6f9)!important}.xp{background:linear-gradient(90deg,#aa7842,#e7d797)!important}.target{padding:12px 22px!important;color:#e8dcb6!important;font-family:Georgia,serif;font-size:17px}.msg{font-family:Georgia,serif;font-size:17px!important;text-shadow:0 2px 8px #000}@media(max-width:700px){.bottom{bottom:8px!important;gap:2px!important;padding:5px!important}.slot{width:calc((100vw - 48px)/8)!important;height:52px!important}.slot .ico{font-size:20px!important;line-height:36px!important}.notice{display:none}.top{min-width:190px!important;padding:10px!important}.name{font-size:18px!important}}</style></head><body><canvas id="world"></canvas><div class="hud top"><div class="name">ECLIPSE <span style="color:#e9a3b2">ALPHA</span></div><div class="small" id="stats">Executor Rúnico · Nível 1</div><div class="bar"><div class="fill hp" id="hp"></div></div><div class="bar"><div class="fill mp" id="mp"></div></div><div class="bar" style="height:5px"><div class="fill xp" id="xp"></div></div><div class="small" id="gold">Auris: 0 · Abates: 0</div></div><div class="hud notice">WASD: mover<br>Clique: selecionar criatura<br>1–8: habilidades<br>F: coletar · I: inventário<br><span style="color:#d9a5c4">Arena de teste offline (não multiplayer)</span></div><div class="hud target" id="target"></div><div class="hud bottom" id="hotbar"></div><div class="hud msg" id="msg"></div><div id="inv" class="inv"><strong>Inventário</strong><div id="items" class="small"></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=0,H=0;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const keys={},bindings=['1','2','3','4','5','6','7','8'];let dragging=-1;const actionName=i=>skills[i]?.[1]||'';P={x:0,y:0,hp:220,maxhp:220,mp:130,maxmp:130,level:1,xp:0,gold:0,kills:0,inventory:[],cool:Array(8).fill(0),face:0},enemies=[],drops=[],fx=[];let selected=null, msgUntil=0;
const skills=[['⚔','Corte',3,12,45,2.8],['🔥','Ruptura',6,24,75,4.5],['✦','Investida',10,18,55,5],['❄','Selo',12,24,50,5],['🛡','Guarda',16,20,0,0],['⚡','Arco',7,18,58,7],['✴','Eclipse',24,50,120,5],['♥','Cura',18,34,-80,0]];
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
for(let i=0;i<30;i++)spawn();
function spawn(){const a=rand(0,6.28),d=rand(220,1700);enemies.push({x:Math.cos(a)*d,y:Math.sin(a)*d,hp:65,maxhp:65,speed:rand(19,36),atk:0,kind:Math.random()<.25?'Espectro':'Lobo de Cinzas'})}
function text(t){document.getElementById('msg').textContent=t;msgUntil=performance.now()+1500}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;const bound=bindings.indexOf(e.key.toLowerCase());if(bound>=0&&!e.repeat)cast(bound);if(e.key.toLowerCase()==='i')document.getElementById('inv').classList.toggle('show');if(e.key.toLowerCase()==='f'){let d=drops.find(d=>dist(d,P)<65);if(d){P.gold+=d.gold;P.inventory.push(d.item);drops.splice(drops.indexOf(d),1);text('Coletado: '+d.item)}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('click',e=>{const sx=e.clientX-W/2,sy=e.clientY-H/2;const x=P.x+sx/(2*.84)+sy/(2*.43),y=P.y-sx/(2*.84)+sy/(2*.43);selected=enemies.find(m=>Math.hypot(m.x-x,m.y-y)<55)||null});
function cast(i){const s=skills[i],now=performance.now()/1000;if(now<P.cool[i]||P.mp<s[3]||P.hp<=0)return;let t=selected;if(i===7){P.hp=Math.min(P.maxhp,P.hp+80)}else if(i===4){P.hp=Math.min(P.maxhp,P.hp+30)}else if(i===2){let ang=t?Math.atan2(t.y-P.y,t.x-P.x):P.face;P.x+=Math.cos(ang)*105;P.y+=Math.sin(ang)*105}else{if(!t||!enemies.includes(t)||dist(P,t)>s[5]*65){text('Selecione um monstro dentro do alcance');return}t.hp-=s[4]+P.level*3;fx.push({x:t.x,y:t.y,t:0,color:i===3?'#8ac9ff':'#f0618e'});if(t.hp<=0)kill(t)}P.mp-=s[3];P.cool[i]=now+s[2]}
function kill(t){enemies.splice(enemies.indexOf(t),1);selected=null;P.kills++;P.xp+=28;drops.push({x:t.x,y:t.y,item:Math.random()<.15?'Cristal Abissal':'Presa de Cinzas',gold:Math.floor(rand(3,15))});if(P.xp>=P.level*110){P.xp=0;P.level++;P.maxhp+=25;P.maxmp+=10;P.hp=P.maxhp;P.mp=P.maxmp;text('NÍVEL '+P.level+'!')}setTimeout(spawn,4500)}
let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(vx,vy)||1;if(vx||vy){P.x+=vx/len*175*dt;P.y+=vy/len*175*dt;P.face=Math.atan2(vy,vx)}P.mp=Math.min(P.maxmp,P.mp+dt*3);
const T=now/1000;
const iso=(x,y)=>({x:(x-y)*0.84,y:(x+y)*0.43});
const cam=iso(P.x,P.y);
const sp=(x,y)=>{let q=iso(x,y);return{x:q.x-cam.x+W/2,y:q.y-cam.y+H/2}};
const diamond=(x,y,w,h,color,edge)=>{ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+w,y);ctx.lineTo(x,y+h);ctx.lineTo(x-w,y);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(edge){ctx.strokeStyle=edge;ctx.lineWidth=1;ctx.stroke()}};
const ellipse=(x,y,rx,ry,color)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=color;ctx.fill()};
function tree(x,y,scale=1){const p=sp(x,y);if(p.x< -100||p.x>W+100||p.y< -200||p.y>H+200)return;ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale,scale);ellipse(6,5,29,9,'#06131a88');ctx.fillStyle='#44362d';ctx.fillRect(-5,-60,10,65);for(const [a,b,r,c] of [[0,-79,29,'#234c40'],[-18,-58,22,'#315c49'],[19,-57,24,'#17453a'],[0,-96,21,'#4d7656']]){ellipse(a,b,r,r*.82,c)}ellipse(-12,-81,10,5,'#74986b42');ctx.restore()}
function rock(x,y,scale=1){const p=sp(x,y);ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale,scale);ellipse(0,1,26,8,'#08182088');ctx.beginPath();ctx.moveTo(-23,-4);ctx.lineTo(-13,-24);ctx.lineTo(11,-29);ctx.lineTo(26,-9);ctx.lineTo(18,1);ctx.lineTo(-18,3);ctx.closePath();ctx.fillStyle='#657169';ctx.fill();ctx.beginPath();ctx.moveTo(-23,-4);ctx.lineTo(-13,-24);ctx.lineTo(-3,-13);ctx.lineTo(-3,1);ctx.closePath();ctx.fillStyle='#394e50';ctx.fill();ctx.restore()}
function tower(x,y){const p=sp(x,y);ctx.save();ctx.translate(p.x,p.y);ellipse(0,8,64,22,'#06131b99');diamond(0,0,51,27,'#777c70','#b0a88b');ctx.fillStyle='#656b66';ctx.fillRect(-30,-122,60,112);ctx.fillStyle='#3e494f';ctx.fillRect(18,-122,12,112);ctx.fillStyle='#87908a';for(let i=-28;i<30;i+=16)ctx.fillRect(i,-137,12,20);ctx.beginPath();ctx.moveTo(-43,-126);ctx.lineTo(0,-166);ctx.lineTo(43,-126);ctx.closePath();ctx.fillStyle='#473b49';ctx.fill();ctx.fillStyle='#111e25';ctx.fillRect(-8,-40,16,37);ctx.fillStyle='#eccd8090';ctx.fillRect(-4,-93,8,17);ctx.restore()}
function char(x,y,face,player=false,shade=false){const p=sp(x,y);ctx.save();ctx.translate(p.x,p.y);ellipse(0,5,19,7,'#061019a8');const bob=player?Math.sin(T*8)*1.5:0;ctx.translate(0,bob);ctx.fillStyle=shade?'#433658':'#303f59';ctx.beginPath();ctx.moveTo(-9,-23);ctx.lineTo(-15,1);ctx.lineTo(-3,3);ctx.lineTo(1,-15);ctx.lineTo(6,3);ctx.lineTo(16,1);ctx.lineTo(9,-23);ctx.fill();ctx.fillStyle=player?'#c5b9a6':'#ab647a';ctx.beginPath();ctx.moveTo(-14,-50);ctx.lineTo(14,-50);ctx.lineTo(18,-22);ctx.lineTo(-16,-22);ctx.fill();ctx.fillStyle=player?'#283850':'#684058';ctx.fillRect(-12,-48,24,22);ctx.fillStyle=player?'#dfc6a0':'#c99a9a';ellipse(0,-60,12,13,ctx.fillStyle);ctx.fillStyle=player?'#e5e2e9':'#573e6f';ctx.beginPath();ctx.moveTo(-13,-63);ctx.lineTo(-8,-78);ctx.lineTo(10,-78);ctx.lineTo(16,-59);ctx.lineTo(3,-69);ctx.lineTo(-12,-59);ctx.fill();ctx.save();ctx.rotate(player?face*.18:0);ctx.strokeStyle=player?'#f4b365':'#d97194';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(17,-42);ctx.lineTo(23,-71);ctx.stroke();ctx.strokeStyle='#f9e0a5';ctx.lineWidth=1;ctx.stroke();ctx.restore();if(player){ellipse(0,-34,5,5,'#dd5567');ctx.shadowColor='#fe6685';ctx.shadowBlur=13;ellipse(0,-34,3,3,'#ffe2e1')}ctx.restore()}
ctx.fillStyle='#0a171c';ctx.fillRect(0,0,W,H);
const tw=116,th=58,region=5;
const minX=Math.floor((P.x-1600)/120),maxX=Math.floor((P.x+1600)/120);
const minY=Math.floor((P.y-1600)/120),maxY=Math.floor((P.y+1600)/120);
for(let ix=minX;ix<=maxX;ix++)for(let iy=minY;iy<=maxY;iy++){const wx=ix*120,wy=iy*120,p=sp(wx,wy);if(p.x< -150||p.x>W+150||p.y< -100||p.y>H+100)continue;const n=Math.abs(Math.sin(ix*37.71+iy*18.12)*43758.5453)%1;let grass=n>.72?'#2d4940':n>.36?'#29443b':'#334c3e';if(Math.abs(wx)<230||Math.abs(wy)<120)grass='#5d6250';diamond(p.x,p.y,tw,th,grass,'#ffffff08');if(n>.84&&Math.abs(wx)>300&&Math.abs(wy)>220){ellipse(p.x+13,p.y-3,4,2,'#d6ae7777');ellipse(p.x-21,p.y+10,4,2,'#73885d')}}
const props=[];for(let i=-15;i<=15;i++)for(let j=-15;j<=15;j++){let h=Math.abs(Math.sin(i*21.13+j*73.73)*17313.17)%1;const x=i*165+83,y=j*165+57;if(Math.abs(x)<360||Math.abs(y)<200)continue;if(h>.73)props.push({x,y,kind:h>.92?'rock':'tree',h})}props.push({x:480,y:-380,kind:'tower',h:1});
const things=[...props.filter(o=>{let p=sp(o.x,o.y);return p.x>-120&&p.x<W+120&&p.y>-260&&p.y<H+100}).map(o=>({...o,order:o.x+o.y}))];
for(const d of drops)things.push({...d,kind:'drop',order:d.x+d.y});
for(const m of [...enemies]){const dd=dist(P,m);if(dd<290){const k=Math.min(1,dt*m.speed/Math.max(dd,1));m.x+=(P.x-m.x)*k;m.y+=(P.y-m.y)*k;if(dd<30&&T>m.atk){m.atk=T+1.5;P.hp-=7;if(P.hp<=0){P.hp=P.maxhp;P.mp=P.maxmp;P.x=0;P.y=0;text('Você foi derrotado e retornou ao santuário')}}}things.push({kind:'enemy',x:m.x,y:m.y,order:m.x+m.y,m})}
things.push({x:P.x,y:P.y,kind:'player',order:P.x+P.y});
things.sort((a,b)=>a.order-b.order);
for(const o of things){const p=sp(o.x,o.y);if(o.kind==='tree')tree(o.x,o.y,.8+o.h*.55);else if(o.kind==='rock')rock(o.x,o.y,.7+o.h*.3);else if(o.kind==='tower')tower(o.x,o.y);else if(o.kind==='drop'){ctx.shadowBlur=17;ctx.shadowColor='#edc67c';diamond(p.x,p.y-12,10,14,'#f1cb75','#fff8c5');ctx.shadowBlur=0}else if(o.kind==='player')char(o.x,o.y,P.face,true);else if(o.kind==='enemy'){const m=o.m;char(m.x,m.y,0,false,m.kind==='Espectro');ctx.fillStyle='#140e19';ctx.fillRect(p.x-24,p.y-96,48,6);ctx.fillStyle=m.kind==='Espectro'?'#ab83ec':'#ef6575';ctx.fillRect(p.x-23,p.y-95,46*Math.max(0,m.hp/m.maxhp),4);if(selected===m){ctx.strokeStyle='#f6d18d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,25,11,0,0,7);ctx.stroke()}}}
for(const e of fx){e.t+=dt;const p=sp(e.x,e.y);ctx.strokeStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=17;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(p.x,p.y,18+e.t*125,10+e.t*60,0,0,7);ctx.stroke();ctx.shadowBlur=0}for(let i=fx.length-1;i>=0;i--)if(fx[i].t>.35)fx.splice(i,1);
const fade=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.1,W/2,H/2,Math.max(W,H)*.67);fade.addColorStop(0,'#0000');fade.addColorStop(1,'#050911b0');ctx.fillStyle=fade;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#eed5a3';ctx.font='bold 15px Georgia';ctx.fillText('VALE DE ASHEN · FRONTEIRA DE VELMORA',Math.max(20,W/2-180),65);
document.getElementById('hp').style.width=(100*P.hp/P.maxhp)+'%';document.getElementById('mp').style.width=(100*P.mp/P.maxmp)+'%';document.getElementById('xp').style.width=(100*P.xp/(P.level*110))+'%';document.getElementById('stats').textContent='Executor Rúnico · Nível '+P.level+' · HP '+Math.floor(P.hp)+' / '+P.maxhp;document.getElementById('gold').textContent='Auris: '+P.gold+' · Abates: '+P.kills;document.getElementById('target').style.display=selected?'block':'none';if(selected)document.getElementById('target').textContent=selected.kind+' · '+Math.max(0,Math.floor(selected.hp))+' HP';document.getElementById('items').textContent=P.inventory.join(' · ')||'Vazio';document.getElementById('hotbar').innerHTML=skills.map((s,i)=>{let cd=Math.max(0,P.cool[i]-now/1000);return '<div class="slot" data-skill="'+i+'" title="'+s[1]+' · Tecla '+bindings[i]+' · Custo '+s[3]+' mana" style="pointer-events:auto;cursor:pointer"><span class="n">'+bindings[i]+'</span><div class="ico">'+s[0]+'</div>'+(cd>0?'<div class="cd">'+cd.toFixed(1)+'</div>':'')+'</div>'}).join('');if(now>msgUntil)document.getElementById('msg').textContent='';requestAnimationFrame(frame)}
const hotbar=document.getElementById('hotbar');
hotbar.addEventListener('click',e=>{const slot=e.target.closest('[data-skill]');if(slot)cast(Number(slot.dataset.skill))});
hotbar.addEventListener('contextmenu',e=>{const slot=e.target.closest('[data-skill]');if(slot){e.preventDefault();const i=Number(slot.dataset.skill);const key=prompt('Nova tecla para '+skills[i][1]+' (uma letra ou número):',bindings[i]);if(key&&/^[a-z0-9]$/i.test(key)&&!['w','a','s','d','f','i'].includes(key.toLowerCase())&&!bindings.includes(key.toLowerCase())){bindings[i]=key.toLowerCase();text('Atalho atualizado para '+bindings[i])}else if(key!==null)text('Atalho inválido ou já utilizado')}});requestAnimationFrame(frame);
</script></body></html>
