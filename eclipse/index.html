<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECLIPSE — Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#080c17;color:#e7e6f3;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;pointer-events:none}.top{left:18px;top:16px;background:#131a2adf;padding:15px;border:1px solid #435074;border-radius:12px;min-width:245px}.name{font-weight:800;letter-spacing:2px}.small{color:#a6acc8;font-size:12px;margin:6px 0}.bar{height:11px;background:#263044;border-radius:7px;overflow:hidden;margin:5px 0}.fill{height:100%;width:100%;transition:width .16s}.hp{background:linear-gradient(90deg,#b32844,#f45d69)}.mp{background:#567feb}.xp{background:#b99655}.bottom{left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:7px}.slot{width:61px;height:64px;background:#111b2be8;border:1px solid #566587;border-radius:10px;position:relative;text-align:center;padding:5px;font-size:10px}.slot .n{position:absolute;top:3px;left:6px;color:#b8c5ed}.slot .ico{font-size:27px;line-height:46px}.cd{position:absolute;inset:0;border-radius:10px;background:#040916cc;display:grid;place-items:center;font-size:17px;font-weight:bold}.notice{right:20px;top:18px;background:#131a2ae8;padding:12px 16px;border:1px solid #3f4a66;border-radius:11px;font-size:12px;max-width:230px}.inv{display:none;position:fixed;right:18px;bottom:110px;width:240px;background:#141b2aec;border:1px solid #5d6684;border-radius:13px;padding:16px;z-index:3}.inv.show{display:block}.target{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#121929db;padding:10px 20px;border-radius:12px;border:1px solid #514666;min-width:180px;text-align:center;display:none}.msg{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);font-size:13px;color:#f5d393;pointer-events:none}button{pointer-events:auto;background:#273553;color:white;border:1px solid #54638b;border-radius:8px;padding:7px}</style></head><body><canvas id="world"></canvas><div class="hud top"><div class="name">ECLIPSE <span style="color:#e9a3b2">ALPHA</span></div><div class="small" id="stats">Executor Rúnico · Nível 1</div><div class="bar"><div class="fill hp" id="hp"></div></div><div class="bar"><div class="fill mp" id="mp"></div></div><div class="bar" style="height:5px"><div class="fill xp" id="xp"></div></div><div class="small" id="gold">Auris: 0 · Abates: 0</div></div><div class="hud notice">WASD: mover<br>Clique: selecionar criatura<br>1–8: habilidades<br>F: coletar · I: inventário<br><span style="color:#d9a5c4">Arena de teste offline (não multiplayer)</span></div><div class="hud target" id="target"></div><div class="hud bottom" id="hotbar"></div><div class="hud msg" id="msg"></div><div id="inv" class="inv"><strong>Inventário</strong><div id="items" class="small"></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=0,H=0;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const keys={},P={x:0,y:0,hp:220,maxhp:220,mp:130,maxmp:130,level:1,xp:0,gold:0,kills:0,inventory:[],cool:Array(8).fill(0),face:0},enemies=[],drops=[],fx=[];let selected=null, msgUntil=0;
const skills=[['⚔','Corte',3,12,45,2.8],['🔥','Ruptura',6,24,75,4.5],['✦','Investida',10,18,55,5],['❄','Selo',12,24,50,5],['🛡','Guarda',16,20,0,0],['⚡','Arco',7,18,58,7],['✴','Eclipse',24,50,120,5],['♥','Cura',18,34,-80,0]];
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
for(let i=0;i<30;i++)spawn();
function spawn(){const a=rand(0,6.28),d=rand(220,1700);enemies.push({x:Math.cos(a)*d,y:Math.sin(a)*d,hp:65,maxhp:65,speed:rand(19,36),atk:0,kind:Math.random()<.25?'Espectro':'Lobo de Cinzas'})}
function text(t){document.getElementById('msg').textContent=t;msgUntil=performance.now()+1500}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if('12345678'.includes(e.key))cast(+e.key-1);if(e.key.toLowerCase()==='i')document.getElementById('inv').classList.toggle('show');if(e.key.toLowerCase()==='f'){let d=drops.find(d=>dist(d,P)<65);if(d){P.gold+=d.gold;P.inventory.push(d.item);drops.splice(drops.indexOf(d),1);text('Coletado: '+d.item)}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('click',e=>{const x=e.clientX-W/2+P.x,y=e.clientY-H/2+P.y;selected=enemies.find(m=>Math.hypot(m.x-x,m.y-y)<35)||null});
function cast(i){const s=skills[i],now=performance.now()/1000;if(now<P.cool[i]||P.mp<s[3]||P.hp<=0)return;let t=selected;if(i===7){P.hp=Math.min(P.maxhp,P.hp+80)}else if(i===4){P.hp=Math.min(P.maxhp,P.hp+30)}else if(i===2){let ang=t?Math.atan2(t.y-P.y,t.x-P.x):P.face;P.x+=Math.cos(ang)*105;P.y+=Math.sin(ang)*105}else{if(!t||!enemies.includes(t)||dist(P,t)>s[5]*65){text('Selecione um monstro dentro do alcance');return}t.hp-=s[4]+P.level*3;fx.push({x:t.x,y:t.y,t:0,color:i===3?'#8ac9ff':'#f0618e'});if(t.hp<=0)kill(t)}P.mp-=s[3];P.cool[i]=now+s[2]}
function kill(t){enemies.splice(enemies.indexOf(t),1);selected=null;P.kills++;P.xp+=28;drops.push({x:t.x,y:t.y,item:Math.random()<.15?'Cristal Abissal':'Presa de Cinzas',gold:Math.floor(rand(3,15))});if(P.xp>=P.level*110){P.xp=0;P.level++;P.maxhp+=25;P.maxmp+=10;P.hp=P.maxhp;P.mp=P.maxmp;text('NÍVEL '+P.level+'!')}setTimeout(spawn,4500)}
let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(vx,vy)||1;if(vx||vy){P.x+=vx/len*175*dt;P.y+=vy/len*175*dt;P.face=Math.atan2(vy,vx)}P.mp=Math.min(P.maxmp,P.mp+dt*3);ctx.fillStyle='#101b23';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-P.x,H/2-P.y);
for(let x=Math.floor((P.x-W/2)/100)*100;x<P.x+W/2+100;x+=100)for(let y=Math.floor((P.y-H/2)/100)*100;y<P.y+H/2+100;y+=100){ctx.fillStyle=((x+y)/100)%2?'#182a2c':'#1b3032';ctx.fillRect(x,y,99,99);ctx.strokeStyle='#2b3a3d';ctx.strokeRect(x,y,100,100)}
for(const d of drops){ctx.fillStyle='#f5c46d';ctx.beginPath();ctx.moveTo(d.x,d.y-12);ctx.lineTo(d.x+9,d.y);ctx.lineTo(d.x,d.y+12);ctx.lineTo(d.x-9,d.y);ctx.fill()}
for(const m of [...enemies]){const dd=dist(P,m);if(dd<290){const k=Math.min(1,dt*m.speed/dd);m.x+=(P.x-m.x)*k;m.y+=(P.y-m.y)*k;if(dd<30&&now/1000>m.atk){m.atk=now/1000+1.5;P.hp-=7;if(P.hp<=0){P.hp=P.maxhp;P.mp=P.maxmp;P.x=0;P.y=0;text('Você foi derrotado e retornou ao santuário')}}}ctx.fillStyle=m.kind==='Espectro'?'#ba8fe8':'#c45d70';ctx.beginPath();ctx.arc(m.x,m.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5a2630';ctx.fillRect(m.x-19,m.y-29,38,5);ctx.fillStyle='#ec7788';ctx.fillRect(m.x-19,m.y-29,38*Math.max(0,m.hp/m.maxhp),5);if(selected===m){ctx.strokeStyle='#f0d48f';ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y,24,0,7);ctx.stroke()}}
ctx.fillStyle='#88bed6';ctx.beginPath();ctx.arc(P.x,P.y,17,0,7);ctx.fill();ctx.strokeStyle='#e8f4ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+Math.cos(P.face)*25,P.y+Math.sin(P.face)*25);ctx.stroke();
for(const f of fx){f.t+=dt;ctx.strokeStyle=f.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,18+f.t*110,0,7);ctx.stroke()}for(let i=fx.length-1;i>=0;i--)if(fx[i].t>.3)fx.splice(i,1);ctx.restore();
document.getElementById('hp').style.width=(100*P.hp/P.maxhp)+'%';document.getElementById('mp').style.width=(100*P.mp/P.maxmp)+'%';document.getElementById('xp').style.width=(100*P.xp/(P.level*110))+'%';document.getElementById('stats').textContent='Executor Rúnico · Nível '+P.level+' · HP '+Math.floor(P.hp)+' / '+P.maxhp;document.getElementById('gold').textContent='Auris: '+P.gold+' · Abates: '+P.kills;document.getElementById('target').style.display=selected?'block':'none';if(selected)document.getElementById('target').textContent=selected.kind+' · '+Math.max(0,Math.floor(selected.hp))+' HP';document.getElementById('items').textContent=P.inventory.join(' · ')||'Vazio';document.getElementById('hotbar').innerHTML=skills.map((s,i)=>{let cd=Math.max(0,P.cool[i]-now/1000);return '<div class="slot"><span class="n">'+(i+1)+'</span><div class="ico">'+s[0]+'</div>'+(cd>0?'<div class="cd">'+cd.toFixed(1)+'</div>':'')+'</div>'}).join('');if(now>msgUntil)document.getElementById('msg').textContent='';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
